exchange: binance
symbol: BTC/USDT
timeframe: 1h
limit: 3000
use_futures: false

similarity:
  window_bars: 24
  n_neighbors: 24
  forecast_horizon_bars: 6
  use_regime_split: true
  use_distance_weights: true
  regime_min_train_rows: 36
  min_effective_neighbors: 5.0

backtest:
  transaction_cost_bp: 2
  threshold_long: 0.54
  threshold_short: 0.44

trade_gate:
  use_ev_metrics_in_gate: true
  use_ev_gate: true
  blocked_ev_buckets:
    - ev_lt_0
  require_forecast_ev_positive: true
  min_volume_vs_sma20_mult: 1.1
  rsi_max_long: 70
  rsi_min_short: 30
  max_price_ema50_atr_mult: 2.0
  weak_breakout_edge_ratio: 1.05
  strict_trend_ema_alignment: false
  trend_ema_drift: null
  cooldown_bars_after_trade: 8
  block_same_direction_reentry_bars: 8
  max_trades_per_calendar_day: 1
  trade_with_trend_only: true
  long_only: false
  use_support_resistance_filter: true
  sr_level_tolerance_natr_mult: 0.8
  use_prob_edge_sizing: false
  prob_edge_min_size: 0.0
  prob_edge_power: 1.0
  comb_prob_min: 0.55
  liq_hard_min: 0.03
  expected_move_vs_cost_mult: 1.6
  expected_move_vs_natr_mult: 1.1
  expected_move_vs_natr_mult_high_vol: 1.52
  blocked_knn_regimes: []
  allowed_ev_buckets: []
  min_ev_trade: 0.0
  min_forecast_ev_abs: null
  use_auto_ev_calibration: false
  ev_min: 0.0
  min_skew: null
  min_effective_neighbors_gate: null
  min_ev_vol_ratio: null

# Эталонный прогон (утверждён): python -m forecast.run_multi_symbol_backtest
# MULTI_BT_USE_FILTERED=1 MULTI_BT_DEPOSIT=300 MULTI_BT_RISK_PCT=0.5 MULTI_BT_TARGET_TRADES=100
# → ~+16.86 R, win ~87%, PF ~4.3 (long+short, spot/1x, без капа в отчёте PnL)
reference_backtest:
  deposit_usdt: 300
  risk_pct: 0.5
  target_trades: 100
  symbols: 50_filtered
  timeframe: 1h
  bars: 1000
  stage1_min_score: 18
  stage1_relax_score: 12
  long_short: true
  leverage: 1
  fee_r_per_trade: 0.08
  trend_lookback: 60
  min_move_pct: 0.008
  min_rel_volume: 1.2
  tp_target_pct: 0.04
  max_hold_bars_1h: 48
  cooldown_bars_same_symbol: 4

# Live-скан + systemd (каждый час :03 UTC) — максимально как бэктест, spot long only
trend_scan:
  timeframe: 1h
  bars: 1000
  top_n: 20
  stage1_min_score: 18
  use_filtered: true
  long_only: true
  use_closed_bar_only: true
  min_prob_pct: 50
  lookback: 60
  min_move_pct: 0.008
  min_rel_volume: 1.2
  block_asian_session: false

auto_trade:
  enabled: false
  dry_run: true
  market_type: spot
  spot_allow_short: false
  min_score: 18
  min_probability_pct: 50
  min_risk_reward: 1.5
  risk_pct_of_balance: 0.5
  max_notional_usdt: 50
  cooldown_minutes: 0
  leverage: 1
  use_target_2: true
  pick_from_top_n: 10
  max_open_positions: 6
  profit_close_pct: 0
  allow_level_breakout: false
  allow_triangle: false
  allowed_hours: ""
  min_atr_pct: 0
  stop_loss_roi_usdt: 0
